# Firma la app y la sube a App Store Connect (TestFlight / App Store).
# Se copia a .github/workflows/release-ios.yml del repo PÚBLICO de compilación.
#
# Secrets necesarios en ese repo (Settings > Secrets and variables > Actions):
#   SOURCE_DEPLOY_KEY      la misma deploy key que usa build-ios.yml
#   APPLE_TEAM_ID          Team ID de la cuenta de Apple Developer (10 caracteres)
#   APP_BUNDLE_ID          identificador de la app, igual al del registro en App Store Connect
#   APPSTORE_KEY_ID        ID de la clave de la API de App Store Connect
#   APPSTORE_ISSUER_ID     Issuer ID de esa clave
#   APPSTORE_API_KEY_P8    contenido completo del archivo AuthKey_XXXX.p8
#
# La firma es automática en la nube: xcodebuild crea el certificado de distribución y el
# perfil con la clave de la API (la clave necesita el rol Admin). Hay que compilar con
# Xcode 26 o posterior, que es lo que exige la App Store desde abril de 2026.
#
# El log de un repo público lo ve cualquiera: la salida de xcodebuild va a un archivo y,
# si falla, solo se imprimen las líneas "error:".
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión que verán los usuarios (por ejemplo 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - name: Comprobar los secrets
        run: |
          for name in TEAM_ID BUNDLE_ID KEY_ID ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "Falta el secret para $name"; exit 1; fi
          done
          if [ -z "${{ secrets.APPSTORE_API_KEY_P8 }}" ]; then echo "Falta APPSTORE_API_KEY_P8"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          repository: arielfmeza91/azuracast-manager
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        working-directory: src/ios
        run: xcodegen generate

      - name: Guardar la clave de App Store Connect
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Crear el archivo firmado
        working-directory: src/ios
        run: |
          if ! xcodebuild archive \
              -project AzuraCastManager.xcodeproj \
              -scheme AzuraCastManager \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/AzuraCastManager.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
              CODE_SIGN_STYLE=Automatic \
              MARKETING_VERSION="${{ inputs.version }}" \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              > "$RUNNER_TEMP/archive.log" 2>&1; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -60
            exit 1
          fi
          echo "Archivo creado"

      - name: Exportar y subir a App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/AzuraCastManager.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              > "$RUNNER_TEMP/export.log" 2>&1; then
            grep -E "error:|Error|ERROR" "$RUNNER_TEMP/export.log" | sort -u | head -60
            exit 1
          fi
          echo "Subida a App Store Connect correcta. La compilación aparecerá en TestFlight en unos minutos."
